server:
  address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health,mcpConnections
session-agent:
  skills:
    roots: []
    max-file-bytes: 65536
    max-skills: 128
  mcp:
    refresh-interval: ${SESSION_AGENT_MCP_REFRESH_INTERVAL:60s}
    request-timeout: ${SESSION_AGENT_MCP_REQUEST_TIMEOUT:30s}
    initial-backoff: ${SESSION_AGENT_MCP_INITIAL_BACKOFF:1s}
    maximum-backoff: ${SESSION_AGENT_MCP_MAXIMUM_BACKOFF:60s}
    shutdown-timeout: ${SESSION_AGENT_MCP_SHUTDOWN_TIMEOUT:5s}
  model:
    max-model-calls-per-message: ${SESSION_AGENT_MAX_MODEL_CALLS_PER_MESSAGE:12}
  worker:
    concurrency: 4
    max-unfinished-jobs: 100
    poll-delay: 1s
    lock-duration: 30s
    transient-retries: 3
    maximum-backoff: 60s
  slack:
    app-token: ${SLACK_APP_TOKEN:}
    bot-token: ${SLACK_BOT_TOKEN:}
    bot-user-id: ${SLACK_BOT_USER_ID:}
    reconnect-delay: 5s
    shutdown-timeout: 5s
    delivery:
      poll-delay: 1s
      lease-duration: 30s
      call-timeout: 25s
      initial-backoff: 1s
      maximum-backoff: 60s
      maximum-attempts: 5
    progress:
      poll-delay: 2s
      refresh-interval: 30s
      workspace-interval: 2s
spring:
  config:
    import: optional:classpath:models.yml
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SESSION_AGENT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/session_agent}
    username: ${SESSION_AGENT_DATASOURCE_USERNAME:session_agent}
    password: ${SESSION_AGENT_DATASOURCE_PASSWORD}
  ai:
    retry:
      max-attempts: 1
    chat:
      client:
        tool-calling:
          enabled: false
mybatis-plus:
  configuration:
    cache-enabled: false
    local-cache-scope: STATEMENT
    return-instance-for-empty-row: true
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
