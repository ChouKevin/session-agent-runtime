session-agent:
  model:
    default-model: google-primary
    models:
      google-primary:
        provider: google-genai
        model-id: ${GOOGLE_GENAI_MODEL:gemini-3.1-flash-lite}
        api-key: ${GOOGLE_API_KEY:}
        context-window-tokens: 1048576
        max-output-tokens: 8192
