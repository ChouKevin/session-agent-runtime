services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: session_agent
      POSTGRES_USER: session_agent
      POSTGRES_PASSWORD: ${SESSION_AGENT_POSTGRES_PASSWORD:?SESSION_AGENT_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session_agent -d session_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - session-agent-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

  session-agent-runtime:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SESSION_AGENT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/session_agent
      SESSION_AGENT_DATASOURCE_USERNAME: session_agent
      SESSION_AGENT_DATASOURCE_PASSWORD: ${SESSION_AGENT_POSTGRES_PASSWORD:?SESSION_AGENT_POSTGRES_PASSWORD is required}
      SERVER_ADDRESS: 0.0.0.0
      SPRING_APPLICATION_JSON: ${SESSION_AGENT_MCP_CONFIGURATION_JSON:-{}}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-3.1-flash-lite}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SESSION_AGENT_PORT:-8090}:8080
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

volumes:
  session-agent-postgres:
