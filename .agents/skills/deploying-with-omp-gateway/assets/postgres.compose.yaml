services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: session_agent
      POSTGRES_USER: session_agent
      POSTGRES_PASSWORD: ${SESSION_AGENT_POSTGRES_PASSWORD:?Database password is required}
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session_agent -d session_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - session-agent-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
volumes:
  session-agent-postgres:
